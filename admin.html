<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANENGOS 管理台</title>
<style>
  :root {
    --bg: #0B0F14; --card: #121A22; --border: #1E2A36;
    --text: #E5E7EB; --muted: #8B95A5;
    --accent: #22D3EE; --accent-dim: rgba(34,211,238,.12);
    --ok: #34D399; --warn: #FBBF24; --danger: #F87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0E1520, var(--bg));
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--danger); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 28px 48px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: auto; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea, input[type="password"], input[type="text"] {
    width: 100%; background: #0E141C; border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 13px;
    font-family: inherit; outline: none;
  }
  textarea { min-height: 84px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
  textarea:focus, input:focus { border-color: var(--accent); }
  button {
    background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: .15s;
  }
  button:hover { background: var(--accent); color: #04141B; }
  button.small { padding: 5px 10px; font-size: 12px; }
  button.ok { background: rgba(52,211,153,.12); border-color: var(--ok); color: var(--ok); }
  button.ok:hover { background: var(--ok); color: #04140E; }
  button.danger { background: rgba(248,113,113,.12); border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #1A0505; }
  button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; }
  .row .grow { flex: 1; }
  .result {
    margin-top: 12px; background: #0E141C; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
    line-height: 1.65; max-height: 320px; overflow: auto; display: none;
  }
  .approval {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    margin-bottom: 10px; background: #0E141C;
  }
  .approval .head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .approval .tool { color: var(--accent); font-family: ui-monospace, monospace; }
  .approval .args {
    margin-top: 8px; font-size: 12px; color: var(--muted);
    font-family: ui-monospace, monospace; background: #0B0F14;
    border-radius: 6px; padding: 8px; white-space: pre-wrap; word-break: break-all;
  }
  .approval .sim { margin-top: 6px; font-size: 12px; color: var(--warn); }
  .approval .ops { margin-top: 10px; display: flex; gap: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 14px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 8px; border-bottom: 1px solid rgba(30,42,54,.5); vertical-align: top; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; }
  .pill.ok { background: rgba(52,211,153,.15); color: var(--ok); }
  .pill.warn { background: rgba(251,191,36,.15); color: var(--warn); }
  .pill.bad { background: rgba(248,113,113,.15); color: var(--danger); }
  .pill.muted { background: rgba(139,149,165,.15); color: var(--muted); }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .file {
    background: #0E141C; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-family: ui-monospace, monospace; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .toast {
    position: fixed; right: 20px; bottom: 20px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px;
    font-size: 13px; display: none; z-index: 99;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>ANENGOS <span>管理台</span></h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statText">未连接</span></div>
</header>
<div class="wrap">

  <div class="card">
    <h2>接入令牌 <span class="tag" id="roleTag">管理员登录后可见租户管理</span></h2>
    <div class="row">
      <input type="password" id="token" class="grow" placeholder="输入 ANENGOS_API_TOKEN 或租户令牌后保存">
      <button onclick="saveToken()">保存令牌</button>
      <button class="ghost" onclick="loadAll()">刷新</button>
      <button class="ghost" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="card" id="tenantPanel" style="display:none">
    <h2>客户账号（租户） <span class="tag">仅管理员</span></h2>
    <div class="row">
      <input type="text" id="tenantName" class="grow" placeholder="客户名称，如：泉州某公司">
      <button onclick="createTenant()">创建租户</button>
    </div>
    <div id="tenants" style="margin-top:12px"></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>运行任务 <span class="tag">异步执行 · 不阻塞</span></h2>
        <label>任务描述（真实模型 + 治理执行）</label>
        <textarea id="query" placeholder="例如：在工作区创建一个 项目日报.md，内容为本周完成 ANENGOS 管理台开发，然后列出工作区文件"></textarea>
        <div class="row" style="margin-top:10px">
          <button onclick="runTask()">提交任务</button>
          <button class="ghost" onclick="loadTasks()">任务列表</button>
        </div>
        <div class="result" id="runResult"></div>
        <div id="taskList" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <h2>审批队列 <span class="tag" id="pendingCount">0 项待批</span></h2>
        <div id="approvals"></div>
        <div class="row" style="margin-top:6px">
          <button class="ok" onclick="approveAll()">全部批准</button>
          <button class="ghost" onclick="loadApprovals()">刷新队列</button>
        </div>
      </div>

      <div class="card">
        <h2>用量与配额 <span class="tag">计费基础</span>
          <button class="ghost" style="float:right;padding:3px 10px;font-size:12px" onclick="exportUsage()">导出账单 CSV</button>
        </h2>
        <div id="usage"></div>
      </div>
      <div class="card">
        <h2>账单与支付 <span class="tag">Token 售卖</span></h2>
        <p style="color:#646A73;font-size:13px">客户订单：下单 → 支付（mock 演示通道）→ 自动升级租户配额。线下收款时用「标记已付」补单。</p>
        <div id="orders" style="margin-top:10px;font-size:13px"></div>
      </div>
      <div class="card">
        <h2>告警 Webhook <span class="tag">自动化催费</span></h2>
        <p style="color:#646A73;font-size:13px">租户用量达到阈值时自动推送告警（同档位每月只发一次；100% 档始终触发）。</p>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <input id="wh_url" placeholder="https://hooks.example.com/anengos" style="flex:1;min-width:260px" />
          <select id="wh_threshold" style="width:130px">
            <option value="0.5">50% 即告警</option>
            <option value="0.8" selected>80% 告警</option>
            <option value="1.0">100% 才告警</option>
          </select>
          <button onclick="saveWebhook()">保存设置</button>
        </div>
        <div id="wh_log" style="margin-top:10px;font-size:13px;color:#646A73"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>互审结论 <span class="tag">监督智能体审核外部产出</span></h2>
        <div style="max-height:240px;overflow:auto" id="reviews"></div>
      </div>

      <div class="card">
        <h2>审计日志 <span class="tag">最近 50 条</span></h2>
        <div style="max-height:320px;overflow:auto" id="audit"></div>
      </div>

      <div class="card">
        <h2>工作区文件 <span class="tag">只读</span></h2>
        <div class="files" id="files"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const savedToken = localStorage.getItem("anengos_token") || "";
if (savedToken) $("token").value = savedToken;

function api(path, opts = {}) {
  const token = $("token").value.trim() || savedToken;
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  return fetch(path, Object.assign({ headers }, opts)).then(async r => {
    let data = null;
    try { data = await r.json(); } catch (e) { data = { error: "非 JSON 响应" }; }
    if (r.status === 401 && !token) { location.href = "/login"; throw new Error("未登录"); }
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    return data;
  });
}

function logout() {
  fetch("/api/logout", { method: "POST" }).then(() => location.href = "/login").catch(() => location.href = "/login");
}

function toast(msg, ok = true) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  t.style.borderColor = ok ? "var(--ok)" : "var(--danger)";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 3000);
}

function saveToken() {
  localStorage.setItem("anengos_token", $("token").value.trim());
  toast("令牌已保存");
  loadAll();
}

let currentRole = null;

function loadMe() {
  api("admin/api/me").then(d => {
    currentRole = d.role;
    $("roleTag").textContent = d.role === "admin"
      ? "管理员 · 全局视图"
      : "租户：" + (d.name || d.tenant_id) + " · 仅见自己的数据";
    $("tenantPanel").style.display = d.role === "admin" ? "" : "none";
    if (d.role === "admin") loadTenants();
  }).catch(() => {
    currentRole = null;
    $("roleTag").textContent = "未登录或令牌无效";
    $("tenantPanel").style.display = "none";
  });
}

function createTenant() {
  const name = $("tenantName").value.trim();
  if (!name) { toast("请输入客户名称", false); return; }
  api("admin/api/tenants", { method: "POST", body: JSON.stringify({ name: name }) })
    .then(d => {
      toast("租户已创建，令牌已复制（一次性）");
      navigator.clipboard && navigator.clipboard.writeText(d.token);
      $("tenantName").value = "";
      loadTenants();
    })
    .catch(e => toast(e.message, false));
}

function loadTenants() {
  api("admin/api/tenants").then(d => {
    const list = d.tenants || [];
    const box = $("tenants");
    if (!list.length) { box.innerHTML = '<div class="empty">暂无租户，创建第一个客户账号</div>'; return; }
    box.innerHTML = list.map(t => `
      <div class="approval">
        <div class="head">
          <span class="pill ${t.status === 'active' ? 'ok' : 'bad'}">${t.status === 'active' ? '启用' : '已停用'}</span>
          <span style="font-weight:600">${esc(t.name)}</span>
          <span style="color:var(--muted);font-family:monospace;font-size:11px;margin-left:auto">${esc(t.id)}</span>
        </div>
        <div class="sim" style="margin-top:6px">创建于 ${esc(String(t.created_at || "").slice(0, 19).replace("T", " "))}</div>
        ${t.status === 'active' ? '<div class="ops"><button class="danger small" onclick="revokeTenant(\'' + esc(t.id) + '\')">停用</button></div>' : ""}
      </div>`).join("");
  }).catch(e => { box.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; });
}

function revokeTenant(id) {
  if (!confirm("确定停用该租户？其令牌将立即失效。")) return;
  api("admin/api/tenants/" + id + "/revoke", { method: "POST" })
    .then(d => { toast(d.message || "已停用"); loadTenants(); })
    .catch(e => toast(e.message, false));
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function loadHealth() {
  fetch("health").then(r => r.json()).then(h => {
    $("dot").className = "dot " + (h.status === "ok" ? "ok" : "bad");
    $("statText").textContent = h.status === "ok"
      ? "在线 · " + (h.model || "") + (h.has_api_key ? "" : " · 未接模型")
      : "离线";
  }).catch(() => {
    $("dot").className = "dot bad";
    $("statText").textContent = "离线";
  });
}

function runTask() {
  const q = $("query").value.trim();
  if (!q) { toast("请输入任务描述", false); return; }
  const btn = event.target;
  btn.disabled = true; btn.textContent = "提交中…";
  api("admin/api/run-async", { method: "POST", body: JSON.stringify({ query: q }) })
    .then(d => {
      $("runResult").textContent = "任务已提交（" + d.task_id + "），后台执行中，自动刷新结果…";
      $("runResult").style.display = "block";
      pollTask(d.task_id);
      toast("任务已提交");
    })
    .catch(e => { toast(e.message, false); $("runResult").textContent = "错误：" + e.message; $("runResult").style.display = "block"; })
    .finally(() => { btn.disabled = false; btn.textContent = "提交任务"; });
}

function pollTask(tid, tries) {
  tries = tries || 0;
  api("admin/api/tasks/" + tid).then(d => {
    if (d.status === "running" && tries < 60) {
      setTimeout(() => pollTask(tid, tries + 1), 1500);
      return;
    }
    const out = $("runResult");
    if (d.status === "error") {
      out.textContent = "【任务失败】" + (d.error || "未知错误");
    } else {
      let txt = "【输出】\n" + (d.output || "(无)");
      if (d.blocked) txt += "\n\n【已拦截】" + d.blocked;
      if (d.pending_approvals && d.pending_approvals.length)
        txt += "\n\n【待审批】" + d.pending_approvals.map(a => a.tool).join(", ") + "（见右侧审批队列）";
      out.textContent = txt;
    }
    out.style.display = "block";
    loadApprovals(); loadAudit(); loadTasks(); loadFiles();
  }).catch(e => { $("runResult").textContent = "查询失败：" + e.message; $("runResult").style.display = "block"; });
}

function loadTasks() {
  api("admin/api/tasks").then(d => {
    const list = d.tasks || [];
    const box = $("taskList");
    if (!list.length) { box.innerHTML = ""; return; }
    box.innerHTML = '<div class="empty" style="font-size:12px">最近任务（挂起任务审批后自动续跑）：</div>' +
      list.slice(0, 6).map(t => {
        const label = t.status === "waiting_approval" ? "待审批" : t.status;
        const cls = t.status === "done" ? "ok" : (t.status === "error" ? "bad" : "run");
        return `<div style="font-size:12px;margin-top:4px;border-bottom:1px solid var(--border);padding:3px 0">
          <span class="pill ${cls}">${label}</span>
          <span style="margin-left:6px">${esc(String(t.query).slice(0, 40))}</span>
          <span style="float:right;color:var(--muted)">${esc(String(t.created_at).slice(11, 19))}</span>
        </div>`;
      }).join("");
  }).catch(() => {});
}

function loadApprovals() {
  api("admin/api/approvals").then(d => {
    const list = d.pending || [];
    $("pendingCount").textContent = list.length + " 项待批";
    const box = $("approvals");
    if (!list.length) { box.innerHTML = '<div class="empty">暂无待审批操作</div>'; return; }
    box.innerHTML = list.map(a => `
      <div class="approval">
        <div class="head">
          <span class="pill warn">待批</span>
          <span class="tool">${esc(a.tool)}</span>
          <span style="color:var(--muted);margin-left:auto">${esc(a.id)}</span>
        </div>
        <div class="args">${esc(JSON.stringify(a.args, null, 2))}</div>
        <div class="sim">模拟结果：${esc(a.simulated_result)}</div>
        <div class="ops">
          <button class="ok small" onclick="decide('${esc(a.id)}','approve')">批准并执行</button>
          <button class="danger small" onclick="decide('${esc(a.id)}','reject')">拒绝</button>
        </div>
      </div>`).join("");
  }).catch(e => { $("approvals").innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; });
}

function decide(id, action) {
  api("admin/api/approvals/" + id + "/" + action, { method: "POST" })
    .then(d => { toast(d.message || (action === "approve" ? "已批准并真实执行" : "已拒绝")); loadApprovals(); loadAudit(); loadFiles(); })
    .catch(e => toast(e.message, false));
}

function approveAll() {
  api("admin/api/approvals/approve-all", { method: "POST" })
    .then(d => { toast("已批准 " + (d.approved || 0) + " 项"); loadApprovals(); loadAudit(); loadFiles(); })
    .catch(e => toast(e.message, false));
}

function loadReviews() {
  api("admin/api/reviews").then(d => {
    const list = d.reviews || [];
    const box = $("reviews");
    if (!list.length) { box.innerHTML = '<div class="empty">暂无互审记录（外部智能体产出审批后自动审核）</div>'; return; }
    box.innerHTML = list.map(r => {
      const cls = r.verdict === "pass" ? "ok" : (r.verdict === "fix" ? "bad" : "run");
      return `<div class="approval" style="margin-bottom:8px">
        <div class="head">
          <span class="pill ${cls}">${esc(r.verdict || "?")} · ${r.score != null ? r.score : "-"}分</span>
          <span style="font-weight:600;margin-left:6px">${esc(r.tool || "")}</span>
          <span style="float:right;color:var(--muted);font-size:11px">${esc(String(r.ts || "").slice(11, 19))}</span>
        </div>
        <div class="sim">${esc(r.reason || "")}</div>
      </div>`;
    }).join("");
  }).catch(() => { $("reviews").innerHTML = '<div class="empty">加载失败</div>'; });
}

function loadAudit() {
  api("admin/api/audit").then(d => {
    const rows = d.audit || [];
    const box = $("audit");
    if (!rows.length) { box.innerHTML = '<div class="empty">暂无审计记录</div>'; return; }
    const cls = e => e === "tool_call" ? "warn" : (e === "approval_applied" ? "ok" : (e === "approval_rejected" ? "bad" : "muted"));
    box.innerHTML = '<table><thead><tr><th>时间</th><th>事件</th><th>工具</th><th>决策</th></tr></thead><tbody>' +
      rows.map(r => `<tr>
        <td class="mono">${esc(String(r.ts).slice(0, 19).replace("T", " "))}</td>
        <td><span class="pill ${cls(r.event)}">${esc(r.event)}</span></td>
        <td class="mono">${esc(r.tool || "-")}</td>
        <td style="max-width:180px">${esc(r.decision || "")}</td>
      </tr>`).join("") + '</tbody></table>';
  }).catch(e => { $("audit").innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; });
}

function loadFiles() {
  api("admin/api/files").then(d => {
    const files = d.files || [];
    const box = $("files");
    if (!files.length) { box.innerHTML = '<div class="empty">工作区为空</div>'; return; }
    box.innerHTML = files.map(f => `<div class="file"><span>${esc(f.name)}</span><span style="color:var(--muted);font-size:11px">${f.size}</span></div>`).join("");
  }).catch(e => { $("files").innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; });
}

function loadUsage() {
  api("admin/api/usage").then(d => {
    const box = $("usage");
    const list = d.usage || [];
    if (!list.length) { box.innerHTML = '<div class="empty">暂无用量数据</div>'; return; }
    const pct = (used, quota) => quota > 0 ? Math.min(100, Math.round(used / quota * 100)) : 100;
    box.innerHTML = list.map(u => {
      const p = pct(u.tasks_used, u.tasks_quota);
      const color = p >= 100 ? "#E85D5D" : (p >= 80 ? "#F6A24D" : "#2B5F9E");
      const bar = `<div style="background:#EEF1F4;border-radius:4px;height:8px;margin-top:4px"><div style="background:${color};height:8px;width:${p}%;border-radius:4px"></div></div>`;
      return `<div class="approval" style="margin-bottom:8px">
        <div class="head">
          <span style="font-weight:600">${esc(u.name || u.tenant_id)}</span>
          <span class="pill ${p >= 100 ? 'bad' : 'ok'}" style="float:right">${u.tasks_used}/${u.tasks_quota} 任务/月</span>
        </div>
        ${bar}
        <div class="sim">周期 ${esc(u.month || "")} · 状态 ${esc(u.status || "")} · agent 配额 ${u.agents_quota} · 存储 ${u.storage_quota_mb}MB</div>
      </div>`;
    }).join("");
  }).catch(() => { $("usage").innerHTML = '<div class="empty">加载失败</div>'; });
}

function exportUsage() {
  fetch("admin/api/usage/export.csv", { headers: { "Authorization": "Bearer " + $("token").value } })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
    .then(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "anengos_usage_" + new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("账单 CSV 已导出");
    })
    .catch(e => toast("导出失败：" + (e.message || e)));
}

function loadWebhook() {
  api("admin/api/settings/webhook", "GET").then(d => {
    if (d.settings) {
      $("wh_url").value = d.settings.url || "";
      $("wh_threshold").value = String(d.settings.threshold || 0.8);
    }
    const log = (d.recent || []).map(r =>
      `<div>${r.ts.slice(0, 19).replace("T", " ")} · ${r.name} · ${r.tasks_used}/${r.tasks_quota}（${Math.round(r.ratio * 100)}%）· 档位 ${r.level} · ${r.status}</div>`
    ).join("") || "<div>暂无告警记录</div>";
    $("wh_log").innerHTML = log;
  }).catch(() => {});
}

function saveWebhook() {
  const url = $("wh_url").value.trim();
  api("admin/api/settings/webhook", "POST", {
    url: url, threshold: parseFloat($("wh_threshold").value),
    enabled: url ? true : false
  }).then(d => {
    if (d.ok) toast("告警设置已保存"); else toast("保存失败：" + (d.error || ""));
    loadWebhook();
  }).catch(e => toast("保存失败：" + (e.message || e)));
}

function loadOrders() {
  api("admin/api/orders", "GET").then(d => {
    const rows = (d.orders || []).map(o => {
      const paid = o.status === "paid";
      const btn = paid ? "" :
        `<button class="ghost" style="padding:2px 8px;font-size:12px" onclick="markPaid('${o.order_id}')">标记已付</button>`;
      return `<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #1E3050;flex-wrap:wrap">
        <b>${o.plan_name}</b><span style="color:#646A73">¥${(o.amount_cents/100).toFixed(2)}</span>
        <span style="color:#646A73">${o.tenant_id ? o.tenant_id.slice(0,8)+"…" : "未关联"}</span>
        <span style="color:${paid ? "#4ADE80" : "#F6C85F"}">${paid ? "已支付" : o.status}</span>
        <span style="color:#646A73;font-size:12px">${(o.created_at||"").slice(0,19).replace("T"," ")}</span>
        ${btn}</div>`;
    }).join("") || "<div style='color:#646A73'>暂无订单</div>";
    $("orders").innerHTML = rows;
  }).catch(() => {});
}

function markPaid(oid) {
  if (!confirm("确认标记该订单已支付？将立即升级对应租户配额。")) return;
  api("admin/api/orders/" + oid + "/mark-paid", "POST", {}).then(d => {
    if (d.ok) toast("补单成功，配额已升级"); else toast("补单失败：" + (d.error || ""));
    loadOrders(); loadUsage();
  }).catch(e => toast("补单失败：" + (e.message || e)));
}

function loadAll() { loadHealth(); loadMe(); loadApprovals(); loadAudit(); loadReviews(); loadFiles(); loadTasks(); loadUsage(); loadWebhook(); loadOrders(); }
loadAll();
setInterval(loadHealth, 15000);
</script>
</body>
</html>
